name: Daily update

# Once a day: snapshot of every station (bikes and docks), any newly published trip month,
# weather, rebuilt tables, commit, and both Google Sheets. Tableau Public syncs once a day,
# so a daily run is all the dashboards need.
on:
  schedule:
    - cron: "7 16 * * *"   # 16:07 UTC: 11:07 in New York, 08:07 in San Francisco
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore station status history
        uses: actions/cache/restore@v6
        with:
          path: state
          key: status-state-none
          restore-keys: status-state-

      - name: Station status snapshot
        id: status
        continue-on-error: true   # a failing GBFS feed must not stop the trip update
        run: python -m pipeline.status

      - name: Update trips, weather and derived tables
        run: python -m pipeline.run_daily

      - name: Keep a copy of the city status history in the repo
        run: |
          if [ -f state/status_city_hourly.csv ]; then cp state/status_city_hourly.csv data/tables/; fi

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Data update $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push

      - name: Publish core sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m pipeline.publish core

      - name: Publish status sheet
        if: steps.status.outcome == 'success'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m pipeline.publish status

      - name: Save station status history
        if: steps.status.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: state
          key: status-state-${{ github.run_id }}
