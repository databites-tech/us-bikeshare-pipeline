name: Hourly station status

# Snapshot of bikes and docks available at every station, for the operational dashboard.
# The rolling history lives in the Actions cache, not in the repository.
on:
  schedule:
    - cron: "7 * * * *"   # every hour at minute 7
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore station status history
        uses: actions/cache/restore@v6
        with:
          path: state
          key: status-state-none
          restore-keys: status-state-

      - name: Take snapshot
        run: python -m pipeline.status

      - name: Publish to Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m pipeline.publish status

      - name: Save station status history
        uses: actions/cache/save@v6
        with:
          path: state
          key: status-state-${{ github.run_id }}
